<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netabe’ak – Interactive Prototype</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%235B46D4'/%3E%3Ccircle cx='25' cy='35' r='15' fill='white'/%3E%3Ccircle cx='40' cy='29' r='15' fill='%23FFC857' fill-opacity='.92'/%3E%3Cpath d='M17 41l9-9 6 5 14-16' fill='none' stroke='%235B46D4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f3ff;--card:#fff;--tx:#1e1b3a;--mut:#6b6990;--pri:#5b46d4;--soft:#e8e5ff;--ln:#ece9fa;--ok:#dcf5e6;--okt:#146c3a;--wa:#fdeccb;--wat:#8a4b00;--er:#fde0e3;--ert:#b4232f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15132b;--card:#201d3d;--tx:#eceaff;--mut:#a5a2cc;--soft:#322d63;--ln:#2e2a56;--ok:#173b2a;--okt:#7be0a6;--wa:#4a3410;--wat:#ffcf7a;--er:#4a1b22;--ert:#ff9aa4;--pri:#8b7bff;color-scheme:dark}}
html,body{margin:0;height:100%}*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
#login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
#login .l{background:#5b46d4;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
#login .l h1{font-size:34px;margin:0 0 6px}#login .r{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:420px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--soft);color:var(--pri);font-weight:600}
button.p{background:var(--pri);color:#fff}button.p:hover{opacity:.9}
#app{display:none;height:100%}#app.on{display:flex}
nav{width:210px;flex:none;padding:18px 12px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
nav .b{font-size:20px;font-weight:800;color:var(--pri);padding:0 10px}nav small{color:var(--mut);padding:0 10px 10px}
nav a{padding:9px 12px;border-radius:8px;cursor:pointer}nav a.a{background:var(--soft);color:var(--pri);font-weight:700}
nav .q{margin-top:auto;font-style:italic;color:var(--mut);font-size:12px;padding:10px}
main{flex:1;padding:24px;overflow:auto;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
h2{margin:0;font-size:24px}.sub{color:var(--mut);margin-top:2px}
.pill{background:var(--soft);color:var(--pri);padding:6px 12px;border-radius:20px;font-weight:700;font-size:12px;white-space:nowrap}
.g{display:grid;gap:12px;margin-bottom:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.c{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px #0001}
.c .k{color:var(--mut);font-size:12px}.c .v{font-size:24px;font-weight:800;margin:4px 0}
.t{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;background:var(--soft);color:var(--pri)}
.t.ok{background:var(--ok);color:var(--okt)}.t.wa{background:var(--wa);color:var(--wat)}.t.er{background:var(--er);color:var(--ert)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row.cd{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;border:0;box-shadow:0 1px 4px #0001}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;min-width:80px;flex:1}.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-size:12px;padding:6px 4px}td{padding:10px 4px;border-top:1px solid var(--ln)}
tr.cl{cursor:pointer}tr.sel{background:var(--soft)}
.f{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.f .t{cursor:pointer;padding:4px 12px}.f .t.sel{outline:2px solid var(--pri)}
.mut{color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.rs{display:flex;gap:8px;margin-bottom:12px}.rs button.on{background:var(--pri);color:#fff}
@media(max-width:720px){#login{grid-template-columns:1fr}#login .r{max-width:none}#app.on{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;border:0;padding:10px}nav .b,nav small,nav .q{display:none}nav a{white-space:nowrap}main{padding:14px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="nm" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#5B46D4"/><circle cx="25" cy="35" r="15" fill="#fff"/><circle cx="40" cy="29" r="15" fill="#FFC857" fill-opacity=".92"/><path d="M17 41l9-9 6 5 14-16" fill="none" stroke="#5B46D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs></svg><div id="login"><div class="l"><svg width="76" height="76" aria-label="Netabe’ak logo" style="margin-bottom:14px"><use href="#nm"/></svg><h1>Netabe’ak</h1><div style="font-size:18px">Your digital academic twin</div><p style="opacity:.85">Track your grades, spot problems early, and get guidance that fits you.</p></div>
<div class="r"><h2>Welcome back</h2><div class="sub">Log in with your university account.</div><br>
<label>Student ID or email<input id="u" value="221234567"></label><label>Password<input type="password" value="••••••••••"></label>
<button class="p" onclick="go('student')">Log in</button>
<div style="display:flex;justify-content:space-between;margin:12px 0"><a href="#" onclick="toast('Reset link sent (demo)');return false" style="color:var(--pri)">Forgot password?</a><span><a href="#" onclick="lang('en');return false">EN</a> | <a href="#" onclick="lang('ar');return false">العربية</a></span></div>
<div class="mut">A one-time code is sent to confirm your login.</div><br><button onclick="go('advisor')">Demo: log in as Advisor</button></div></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let role='student',view='dashboard',F={};
const NAV={student:[['dashboard','Dashboard'],['grades','Grades'],['trends','Trends'],['alerts','Alerts'],['tips','AI Tips'],['goals','Goals'],['progress','Progress'],['notifs','Notifications'],['history','History'],['settings','Settings']],
advisor:[['dashboard','Dashboard'],['perf','Student Performance'],['alerts','Alerts'],['req','Support Requests'],['settings','Settings']]};
const Q={student:['Small steps today, big results tomorrow.','Reflect today to grow tomorrow.','Progress over perfection.','Stay informed, stay ahead.'],advisor:['Guide today, empower tomorrow.']};
let goals=[['Maintain GPA above 3.8','Dec 2026','In progress'],['Complete core CS courses','May 2027','In progress'],['Join a research project','May 2027','Not started'],['Improve time management','Ongoing','In progress']];
let tips=[['Netabe’ak AI','Review eigenvalues in Linear Algebra','Your quiz scores on this topic are lower than on other topics.'],['Netabe’ak AI','Practice recursion problems for Algorithms','Quiz 2 was below your course average.'],['From your advisor','Meet before the Algorithms midterm','Your advisor suggests a 20-minute check-in this week.'],['Netabe’ak AI','Keep your weekly study plan','Your study streak is 12 days and your GPA is rising.']];
let reqs=[['New','Sally Alharbi · CS285 Algorithms','Can we meet before the midterm? I’m struggling with recursion.','Today, 08:40'],['In progress','Lina Alsubaie · CS210 Data Structures','I missed two assignments and need a plan to catch up.','Yesterday, 15:10'],['Completed','Omar Aldosari · SE201 Software Eng.','Need advice on balancing my project and study time.','Oct 14']];
const sev=s=>({High:'er',Medium:'wa',Low:'ok',Resolved:'ok',New:'',  'In progress':'wa',Completed:'ok'}[s]||'');
const hd=(t,s)=>`<div class="top"><div><h2>${t}</h2><div class="sub">${s}</div></div><span class="pill">${role=='student'?'SL · Sally':'AD · Advisor'}</span></div>`;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const filt=(k,l)=>`<div class="f">${l.map(x=>`<span class="t ${F[k]==x||(!F[k]&&x==l[0])?'sel':''}" onclick="F['${k}']='${x}';render()">${x}</span>`).join('')}</div>`;
const line=(pts,w=520,h=200)=>{const P=pts.map((v,i)=>[30+i*(w-60)/(pts.length-1),h-30-(v-2.9)/(4.1-2.9)*(h-60)]);const ty=h-30-(4-2.9)/1.2*(h-60);
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%"><line x1="20" x2="${w-10}" y1="${ty}" y2="${ty}" stroke="#d33" stroke-dasharray="4"/><text x="${w-60}" y="${ty-4}" fill="#d33" font-size="11">Target 4.0</text><polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${P.map(p=>p.join(',')).join(' ')}"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--pri)"/><text x="${p[0]-12}" y="${p[1]-10}" font-size="11" fill="var(--tx)">${pts[i].toFixed(2)}</text><text x="${p[0]-22}" y="${h-8}" font-size="10" fill="var(--mut)">${['Fall 24','Spr 25','Fall 25','Spr 26','Fall 26'][i]}</text>`).join('')}</svg>`};
const courses=[['Data Structures',94],['Linear Algebra',90],['Algorithms',80],['Software Eng.',70]];
const avgs=`<div class="c"><b>Course average</b>${courses.map(c=>`<div class="row"><span style="width:110px">${c[0]}</span>${bar(c[1])}<b>${c[1]}%</b></div>`).join('')}</div>`;
const V={student:{
dashboard:()=>hd('Dashboard','Your academic standing at a glance.')+`<div class="g g4"><div class="c"><div class="k">Current GPA</div><div class="v">3.75 / 5.0</div><span class="mut">+0.15 from last semester</span></div><div class="c"><div class="k">Target GPA</div><div class="v">4.0 / 5.0</div><span class="mut">Goal: Dec 2026</span></div><div class="c"><div class="k">Credits earned</div><div class="v">84 / 108</div><span class="mut">78% complete</span></div><div class="c"><div class="k">Open alerts</div><div class="v">1</div><span class="mut">Algorithms (CS285)</span></div></div>
<div class="g g2"><div class="c"><span class="t wa" style="float:right">Medium</span><b>Latest alert</b><p><b>Algorithms quiz below your average</b><br><span class="mut">Quiz 2 was 12 points under your course average.</span></p><button onclick="nav('alerts')">View reason</button></div><div class="c"><span class="t" style="float:right">AI</span><b>Top AI tip</b><p><b>Review Linear Algebra: eigenvalues</b><br><span class="mut">Your last two quiz scores on this topic were lower than other topics.</span></p><button class="p" onclick="nav('tips')">See all tips</button></div></div>
<div class="c"><b>Upcoming deadlines</b><div class="row"><span>Assignment 2 · CS285 Algorithms</span><span class="t wa">In 2 days</span></div><div class="row"><span>Quiz · CS223 Linear Algebra</span><span class="t ok">Tomorrow, 10:00</span></div></div><br><button class="p" onclick="toast('Support request sent to your advisor')">Request advisor support</button>`,
grades:()=>hd('Grades','Fall 2026 · current semester (data from the university system).')+`<div class="c" style="overflow:auto"><table><tr><th>Course<th>Code<th>Credits<th>Assignments<th>Quizzes<th>Midterm<th>Grade</tr>${[['Linear Algebra','CS223',3,'88%','92%','90%','A-'],['Algorithms','CS285',3,'84%','78%','80%','B+'],['Data Structures','CS210',3,'95%','93%','94%','A'],['Software Engineering','SE201',3,'90%','In progress','In progress','—']].map(r=>`<tr><td><b>${r[0]}</b><td>${r.slice(1,6).join('<td>')}<td><span class="t">${r[6]}</span></tr>`).join('')}</table></div><br><div class="g g4"><div class="c"><div class="k">Semester GPA</div><div class="v">3.75</div></div><div class="c"><div class="k">Credits this semester</div><div class="v">12</div></div><div class="c"><div class="k">Last synced</div><b>Today, 08:00</b><div class="mut">Grades are read-only</div></div></div>`,
trends:()=>hd('Performance Trends','See whether your performance is improving or declining.')+`<div class="g g2"><div class="c"><span class="t ok" style="float:right">Improving</span><b>GPA over time</b>${line([3.1,3.2,3.45,3.6,3.75])}</div>${avgs}</div><div class="c row"><span><b>Insight:</b> your GPA rose in four straight semesters. Algorithms is the only course trending below your overall level.</span><button onclick="nav('alerts')">View alert</button></div>`,
alerts:()=>{const A=[['Medium','Algorithms (CS285): quiz score dropped','Quiz 2 was 12 points below your course average, and your last two quizzes trend down.','Review recursion and sorting analysis; ask your advisor for help.'],['Low','Assignment 2 due in 2 days','CS285 Assignment 2 is not submitted yet.','Plan a study block before Thursday.'],['Resolved','Linear Algebra: grade updated to A-','The university system posted a new grade.','No action needed.']];const f=F.sa||'All';
return hd('Alerts','Academic-risk warnings and the reason behind each one.')+filt('sa',['All','High','Medium','Resolved'])+A.filter(a=>f=='All'||a[0]==f).map(a=>`<div class="row cd"><div><span class="t ${sev(a[0])}">${a[0]}</span><br><b>${a[1]}</b><br><span class="mut"><b>Why:</b> ${a[2]}<br><b>Suggested action:</b> ${a[3]}</span></div><button onclick="toast('${a[1].replace(/'/g,'')}')">Details</button></div>`).join('')+'<div class="mut">Alerts are early warnings based on your data, not guaranteed outcomes.</div>'},
tips:()=>hd('AI Recommendations','Personalized suggestions, with the reason for each.')+`<div class="g g2">${tips.map((t,i)=>`<div class="c"><span class="t">${t[0]}</span><p><b>${t[1]}</b><br><span class="mut"><b>Why:</b> ${t[2]}</span></p><button class="p" onclick="${t[0]=='From your advisor'?`toast('Support request sent')`:`addGoal(${i})`}">${t[0]=='From your advisor'?'Request support':'Add to goals'}</button> <button onclick="tips.splice(${i},1);render()">Dismiss</button></div>`).join('')||'<div class="c">No more suggestions.</div>'}</div><div class="mut">Suggestions are based on your academic data and may be incomplete. They are not guaranteed outcomes.</div>`,
goals:()=>hd('My Goals','Set your academic goals and stay on track.')+`<div class="g g2"><div class="c"><div class="k">Target GPA</div><div class="v">4.0 / 5.0</div>${bar(94)}<div class="mut">Keep going! You’re on track.</div></div><div class="c"><div class="k">Current GPA</div><div class="v">3.75 / 5.0</div><span style="color:var(--okt)">+0.15 from last semester</span></div></div>${goals.map((g,i)=>`<div class="row cd"><div><b>${g[0]}</b><br><span class="mut">Due: ${g[1]}</span></div><span class="t ${g[2]=='Not started'?'wa':''}" style="cursor:pointer" onclick="goals[${i}][2]=goals[${i}][2]=='Done'?'In progress':goals[${i}][2]=='In progress'?'Done':'In progress';render()">${g[2]}</span></div>`).join('')}<button class="p" onclick="let n=prompt('New goal:');if(n){goals.push([n,'Ongoing','Not started']);render()}">+ Add goal</button><div class="mut" style="margin-top:8px">Tip: click a status to change it.</div>`,
progress:()=>hd('Academic Progress','Track your performance and see your growth.')+`<div class="g g4"><div class="c"><div class="k">Current GPA</div><div class="v">3.75 / 5.0</div></div><div class="c"><div class="k">Completed courses</div><div class="v">28 / 36</div></div><div class="c"><div class="k">Credits earned</div><div class="v">84 / 108</div></div><div class="c"><div class="k">Study streak</div><div class="v">12 days</div></div></div><div class="c row"><span><b>Course completion</b><br><span class="mut">28 completed · 6 in progress · 2 not started</span></span><b style="font-size:28px;color:var(--pri)">78%</b></div><br><div class="c"><b>Current semester courses</b>${[['Linear Algebra','CS223','A-',80],['Algorithms','CS285','B+',60],['Data Structures','CS210','A',90],['Software Engineering','SE201','—',30]].map(c=>`<div class="row"><span style="width:150px"><b>${c[0]}</b></span><span style="width:60px">${c[1]}</span><span style="width:30px">${c[2]}</span>${bar(c[3])}<span>${c[3]}%</span></div>`).join('')}</div>`,
notifs:()=>{const N=[['Grade Alerts','er','Your grade for CS223 – Linear Algebra has been updated to A-.','10:15 AM','Today'],['Deadlines','wa','Assignment 2 for CS285 – Algorithms is due in 2 days.','9:00 AM','Today'],['Recommendations','','Consider reviewing Linear Algebra topics on eigenvalues.','8:30 AM','Today'],['Deadlines','wa','You have a quiz for CS223 tomorrow at 10:00 AM.','Oct 22','This Week'],['System','ok','You have completed 75% of your goals this semester!','Oct 21','This Week']];const f=F.sn||'All';
return hd('Notifications','Stay updated with important alerts and recommendations.')+filt('sn',['All','Grade Alerts','Deadlines','Recommendations','System'])+['Today','This Week'].map(d=>{const L=N.filter(n=>n[4]==d&&(f=='All'||n[0]==f));return L.length?`<h4>${d}</h4>`+L.map(n=>`<div class="row cd"><div><span class="t ${n[1]}">${n[0]}</span><br>${n[2]}</div><span class="mut">${n[3]}</span></div>`).join(''):''}).join('')},
history:()=>hd('Academic History','View your past performance and recommendations.')+`<div class="g g2"><div class="c"><b>Previous semesters</b><table><tr><th>Semester<th>Courses<th>GPA<th>Credits</tr>${[['Fall 2026 (Current)',5,3.75,15],['Spring 2026',5,3.6,15],['Fall 2025',5,3.45,15],['Spring 2025',4,3.2,12],['Fall 2024',4,3.1,12]].map(r=>`<tr><td><b>${r[0]}</b><td>${r[1]}<td>${r[2]}<td>${r[3]}</tr>`).join('')}</table></div><div><div class="c" style="margin-bottom:12px"><b>GPA summary</b><div style="display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:8px">${[3.1,3.2,3.45,3.6,3.75].map((v,i)=>`<div style="flex:1;text-align:center;font-size:10px"><div style="height:${v*24}px;background:var(--pri);border-radius:4px" title="${v}"></div>${['F24','S25','F25','S26','F26'][i]}</div>`).join('')}</div></div><div class="c"><b>Credits summary</b><div class="row"><span>Completed</span><b>72</b></div><div class="row"><span>In progress</span><b>12</b></div><div class="row"><span>Remaining</span><b>24</b></div></div></div></div>`,
settings:()=>hd('Settings','Manage your profile, preferences, and account settings.')+`<div class="g g2"><div class="c"><b>Profile information</b><br><br>Full name<input value="Sally Alharbi">Student ID<input value="221234567">Email<input value="sally.alharbi@psu.edu.sa">Major<input value="Computer Science – AI Track"></div><div><div class="c" style="margin-bottom:12px"><b>Academic information</b><br><br>Academic year<input value="3rd Year">Target GPA<input value="4.0 / 5.0"></div><div class="c"><b>Preferences</b><br><br>Language<select onchange="lang(this.value)"><option value="en">English</option><option value="ar">العربية</option></select>Theme<select onchange="document.documentElement.dataset.theme=this.value;document.documentElement.style.colorScheme=this.value"><option value="light">Light mode</option><option value="dark">Dark mode</option></select></div></div></div><button class="p" onclick="toast('Changes saved')">Save changes</button> <button onclick="go('login')">Log out</button>`},
advisor:{
dashboard:()=>hd('Dashboard','Your students’ academic standing at a glance.')+`<div class="g g4"><div class="c"><div class="k">Assigned students</div><div class="v">24</div><span class="mut">Fall 2026</span></div><div class="c"><div class="k">At-risk students</div><div class="v">2</div><span class="mut">High priority</span></div><div class="c"><div class="k">Open alerts</div><div class="v">3</div><span class="mut">2 high priority</span></div><div class="c"><div class="k">Support requests</div><div class="v">2</div><span class="mut">Awaiting reply</span></div></div><div class="g g2"><div class="c"><span class="t" style="float:right">Sorted by risk</span><b>Students needing attention</b>${[['Khalid Alotaibi','GPA dropped 0.40 this semester','High'],['Lina Alsubaie','2 missed assignments in CS210','High'],['Sally Alharbi','Algorithms (CS285): quiz score dropped','Medium']].map(s=>`<div class="row"><span><b>${s[0]}</b><br><span class="mut">${s[1]}</span></span><span class="t ${sev(s[2])}">${s[2]}</span></div>`).join('')}<br><button class="p" onclick="nav('perf')">View all students</button></div><div><div class="c" style="margin-bottom:12px"><span class="t" style="float:right">New</span><b>Latest support request</b><p><b>Sally Alharbi · CS285 Algorithms</b><br><span class="mut">“Can we meet before the midterm? I’m struggling with recursion.”</span></p><button class="p" onclick="nav('req')">Review request</button></div><div class="c"><b>Upcoming advising sessions</b><div class="row"><span>Sally Alharbi</span><span class="t ok">Thu, 11:00</span></div><div class="row"><span>Khalid Alotaibi</span><span class="t wa">Fri, 13:30</span></div></div></div></div>`,
perf:()=>{const S=[['Sally Alharbi','221234567',3.75,4.0,'Improving',[3.1,3.2,3.45,3.6,3.75]],['Khalid Alotaibi','221234102',2.6,3.5,'Declining',[3.0,3.0,2.9,2.8,2.6]],['Lina Alsubaie','221234455',2.95,3.5,'Declining',[3.3,3.2,3.1,3.0,2.95]],['Omar Aldosari','221234890',3.4,3.8,'Stable',[3.4,3.4,3.35,3.4,3.4]],['Reem Alghamdi','221234233',3.9,4.0,'Improving',[3.5,3.6,3.7,3.8,3.9]]];const i=F.ps??0;const s=S[i];const c={Improving:'ok',Declining:'er',Stable:'wa'};
return hd('Student Performance','Compare students and see who is improving or declining.')+`<div class="g g2"><div class="c"><b>Student performance overview</b><table><tr><th>Student<th>ID<th>GPA<th>Target<th>Trend</tr>${S.map((x,j)=>`<tr class="cl ${j==i?'sel':''}" onclick="F.ps=${j};render()"><td><b>${x[0]}</b><td>${x[1]}<td>${x[2].toFixed(2)}<td>${x[3]}<td><span class="t ${c[x[4]]}">${x[4]}</span></tr>`).join('')}</table></div><div class="c"><span class="t ${c[s[4]]}" style="float:right">${s[4]}</span><b>${s[0]} · GPA over time</b>${line(s[5])}${courses.map(k=>`<div class="row"><span style="width:110px">${k[0]}</span>${bar(k[1])}<b>${k[1]}%</b></div>`).join('')}</div></div><div class="c mut">Click a student row to update the chart.</div>`},
alerts:()=>{const A=[['High','Khalid Alotaibi','GPA dropped 0.40 this semester','Three course averages fell below 65% and two quizzes were missed.','Schedule an advising session this week.'],['High','Lina Alsubaie (CS210)','2 missed assignments','Assignments 3 and 4 in CS210 are not submitted.','Contact the student and agree a catch-up plan.'],['Medium','Sally Alharbi (CS285)','Algorithms (CS285): quiz score dropped','Quiz 2 was 12 points below the course average.','Review recursion and sorting analysis; offer a 20-minute check-in.'],['Resolved','Sally Alharbi (CS223)','Linear Algebra: grade updated to A-','The university system posted a new grade.','No action needed.']];const f=F.aa||'All';
return hd('Alerts','Academic-risk warnings for your students and the reason behind each one.')+filt('aa',['All','High','Medium','Resolved'])+A.filter(a=>f=='All'||a[0]==f).map(a=>`<div class="row cd"><div><span class="t ${sev(a[0])}">${a[0]}</span> <span class="t">${a[1]}</span><br><b>${a[2]}</b><br><span class="mut"><b>Why:</b> ${a[3]}<br><b>Suggested action:</b> ${a[4]}</span></div><div><button onclick="toast('Details opened')">Details</button> <button class="p" onclick="toast('${a[0]=='Resolved'?'Archived':'Message drafted to student'}')">${a[0]=='Resolved'?'Archive':'Contact student'}</button></div></div>`).join('')},
req:()=>{const f=F.sr||'All';return hd('Support Requests','Review and respond to students who asked for advisor support.')+`<div class="g g4"><div class="c"><div class="k">New requests</div><div class="v">${reqs.filter(r=>r[0]=='New').length}</div><span class="mut">Awaiting reply</span></div><div class="c"><div class="k">In progress</div><div class="v">${reqs.filter(r=>r[0]=='In progress').length}</div><span class="mut">Follow-up pending</span></div><div class="c"><div class="k">Completed</div><div class="v">12</div><span class="mut">This semester</span></div></div>`+filt('sr',['All','New','In progress','Completed'])+reqs.map((r,i)=>[r,i]).filter(x=>f=='All'||x[0][0]==f).map(([r,i])=>`<div class="row cd"><div><span class="t ${sev(r[0])}">${r[0]}</span> <span class="t">${r[1]}</span><br><b>“${r[2]}”</b><br><span class="mut">Received: ${r[3]}</span></div><div><button onclick="toast('Profile opened')">View profile</button> <button class="p" onclick="act(${i})">${{New:'Schedule session','In progress':'Reply',Completed:'Reopen'}[r[0]]}</button></div></div>`).join('')},
settings:()=>hd('Settings','Manage your profile and preferences.')+`<div class="c" style="max-width:420px">Full name<input value="Advisor">Email<input value="advisor@psu.edu.sa"></div><br><button class="p" onclick="toast('Changes saved')">Save changes</button> <button onclick="go('login')">Log out</button>`}};
function act(i){const r=reqs[i];if(r[0]=='New'){r[0]='In progress';toast('Session scheduled')}else if(r[0]=='In progress'){r[0]='Completed';toast('Reply sent')}else{r[0]='In progress';toast('Request reopened')}render()}
function addGoal(i){goals.push([tips[i][1],'Ongoing','Not started']);tips.splice(i,1);toast('Added to goals');render()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function lang(l){document.documentElement.dir=l=='ar'?'rtl':'ltr'}
function nav(v){view=v;render()}
function go(r){if(r=='login'){$('#login').style.display='grid';$('#app').classList.remove('on');return}role=r;view='dashboard';F={};$('#login').style.display='none';$('#app').classList.add('on');render()}
function render(){$('#nav').innerHTML=`<div class="b" style="display:flex;align-items:center;gap:8px"><svg width="30" height="30" aria-hidden="true"><use href="#nm"/></svg>Netabe’ak</div><small>Plan · Study · Achieve</small>`+NAV[role].map(n=>`<a class="${n[0]==view?'a':''}" onclick="nav('${n[0]}')">${n[1]}</a>`).join('')+`<div class="q">“${Q[role][NAV[role].findIndex(n=>n[0]==view)%Q[role].length]}”</div>`;
$('#main').innerHTML=`<div class="rs"><button class="${role=='student'?'on':''}" onclick="go('student')">Student view</button><button class="${role=='advisor'?'on':''}" onclick="go('advisor')">Advisor view</button></div>`+V[role][view]()}
</script></body></html>
